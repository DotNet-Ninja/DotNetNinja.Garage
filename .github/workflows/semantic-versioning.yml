name: Build, version, and deploy

on:
  push:
    branches: [main]

# Keep version calculations and deployments in the same order as main merges.
concurrency:
  group: garage-main-deployment
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.calculate.outputs.number }}
      tag: ${{ steps.calculate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged pull request labels
        id: labels
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const pr = prs.find(candidate =>
              candidate.base?.ref === 'main' &&
              candidate.merged_at &&
              candidate.merge_commit_sha === context.sha
            ) ?? prs.find(candidate =>
              candidate.base?.ref === 'main' && candidate.merged_at
            );
            const labels = pr?.labels.map(label => label.name.toLowerCase()) ?? [];
            if (labels.includes('major') || labels.includes('breaking')) return 'major';
            if (labels.includes('minor') || labels.includes('feature')) return 'minor';
            return 'patch';

      - name: Calculate semantic version
        id: calculate
        shell: bash
        env:
          BUMP_TYPE: ${{ fromJSON(steps.labels.outputs.result) }}
        run: |
          set -euo pipefail
          latest=v0.0.0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest="$tag"
              break
            fi
          done < <(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname)

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP_TYPE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Invalid bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac

          number="$major.$minor.$patch"
          echo "Previous tag: $latest; next version: $number ($BUMP_TYPE)"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "tag=v$number" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj
      - name: Build with the release version
        env:
          GARAGE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          dotnet build tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj --configuration Release --no-restore \
            -p:Version="$GARAGE_VERSION" \
            -p:AssemblyVersion="$GARAGE_VERSION" \
            -p:FileVersion="$GARAGE_VERSION" \
            -p:InformationalVersion="$GARAGE_VERSION"
      - name: Run xUnit tests
        run: dotnet run --project tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj --configuration Release --no-build --no-restore
      - name: Publish web app
        env:
          GARAGE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          dotnet publish src/DotNetNinja.Garage/DotNetNinja.Garage.csproj \
            --configuration Release --no-build --no-restore --output ./publish \
            -p:Version="$GARAGE_VERSION"
          cd publish
          zip -q -r "../DotNetNinja.Garage-$GARAGE_VERSION.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: garage-release-package
          path: DotNetNinja.Garage-${{ needs.version.outputs.number }}.zip
          if-no-files-found: error

  deploy:
    needs: [version, build-and-test]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Azure deployment settings
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_WEBAPP_NAME; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub production environment secret: $name" >&2
              exit 1
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: garage-release-package
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Web App
        id: webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: DotNetNinja.Garage-${{ needs.version.outputs.number }}.zip
      - name: Verify the deployed version
        env:
          WEBAPP_URL: ${{ steps.webapp.outputs.webapp-url }}
          GARAGE_VERSION: ${{ needs.version.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WEBAPP_URL" ]; then
            echo 'Azure deployment did not return a web app URL.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --max-time 30 "${WEBAPP_URL%/}/Home/About" \
            | grep --fixed-strings "$GARAGE_VERSION"

  release:
    needs: [version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: garage-release-package
      - name: Tag the deployed commit and publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          GARAGE_VERSION: ${{ needs.version.outputs.number }}
          GARAGE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$GARAGE_TAG" -m "Release $GARAGE_TAG"
          git push origin "$GARAGE_TAG"
          gh release create "$GARAGE_TAG" "DotNetNinja.Garage-$GARAGE_VERSION.zip" \
            --verify-tag --title "Release $GARAGE_TAG" \
            --notes "Deployed Garage $GARAGE_TAG from $GITHUB_SHA."
