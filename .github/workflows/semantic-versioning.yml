name: Semantic Versioning

on:
  push:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  version-and-tag:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.versioning.outputs.new-version }}
      version-changed: ${{ steps.versioning.outputs.version-changed }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Get merged PR labels
      id: pr-labels
      uses: actions/github-script@v7
      with:
        script: |
          const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha
          });
          
          if (prs.length === 0) {
            console.log(`No PRs associated with commit ${context.sha}`);
            return { labels: [], bump: 'patch' };
          }
          
          const pr = prs.find(candidate =>
            candidate.base?.ref === 'main' &&
            candidate.merged_at &&
            candidate.merge_commit_sha === context.sha
          ) ?? prs.find(candidate =>
            candidate.base?.ref === 'main' &&
            candidate.merged_at
          );
          
          if (!pr) {
            console.log(`Commit ${context.sha} is not associated with a merged PR targeting main`);
            return { labels: [], bump: 'patch' };
          }
          
          const labels = pr.labels.map(label => label.name.toLowerCase());
          console.log('PR Labels:', labels);
          
          let bump = 'patch'; // default
          if (labels.includes('major') || labels.includes('breaking')) {
            bump = 'major';
          } else if (labels.includes('minor') || labels.includes('feature')) {
            bump = 'minor';
          } else if (labels.includes('patch') || labels.includes('fix') || labels.includes('bugfix')) {
            bump = 'patch';
          }
          
          return { labels, bump, prNumber: pr.number, prTitle: pr.title };
        
    - name: Calculate new version
      id: versioning
      run: |
        # Get the latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"
        
        # Remove 'v' prefix if present
        CURRENT_VERSION=${LATEST_TAG#v}
        
        # Parse version components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        
        # Get bump type from previous step
        BUMP_TYPE="${{ fromJson(steps.pr-labels.outputs.result).bump }}"
        echo "Bump type: $BUMP_TYPE"
        
        # Calculate new version
        case $BUMP_TYPE in
          "major")
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          "minor")
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          "patch")
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        NEW_TAG="v$NEW_VERSION"
        
        echo "New version: $NEW_VERSION"
        echo "New tag: $NEW_TAG"
        
        # Set outputs
        echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "new-tag=$NEW_TAG" >> $GITHUB_OUTPUT
        echo "version-changed=true" >> $GITHUB_OUTPUT
        
        # Check if this is actually a new version
        if [ "$NEW_TAG" = "$LATEST_TAG" ]; then
          echo "version-changed=false" >> $GITHUB_OUTPUT
          echo "No version change needed"
        fi
        
    - name: Create and push tag
      if: steps.versioning.outputs.version-changed == 'true'
      run: |
        NEW_TAG="${{ steps.versioning.outputs.new-tag }}"
        PR_INFO=$(echo '${{ steps.pr-labels.outputs.result }}' | jq -r '.prTitle // "Direct push to main"')
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Create tag with message
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG - $PR_INFO"
        git push origin "$NEW_TAG"
        
        echo "Tagged and pushed: $NEW_TAG"

  build-with-version:
    needs: version-and-tag
    if: needs.version-and-tag.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore DotNetNinja.Garage.slnx
      
    - name: Build with version
      run: |
        VERSION="${{ needs.version-and-tag.outputs.new-version }}"
        dotnet build DotNetNinja.Garage.slnx \
          --configuration Release \
          --no-restore \
          -p:Version=$VERSION \
          -p:AssemblyVersion=$VERSION \
          -p:FileVersion=$VERSION \
          -p:InformationalVersion=$VERSION
      
    - name: Run tests
      run: |
        VERSION="${{ needs.version-and-tag.outputs.new-version }}"
        dotnet test DotNetNinja.Garage.slnx \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage \
          -p:Version=$VERSION
      
    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.version-and-tag.outputs.new-version }}
        release_name: Release v${{ needs.version-and-tag.outputs.new-version }}
        draft: false
        prerelease: false
        body: |
          ## Changes in v${{ needs.version-and-tag.outputs.new-version }}
          
          This release was automatically created from the latest changes to main branch.
          
          **Version:** ${{ needs.version-and-tag.outputs.new-version }}
          **Commit:** ${{ github.sha }}
          
          ### Installation
          Download the release assets below or pull the latest container image.