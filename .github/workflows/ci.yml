name: Build and Test

on:
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        description: 'Version to use for build'

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

permissions:
  contents: read       # Required to checkout code
  actions: read        # Required for workflow access
  checks: write        # Required to write test results
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore DotNetNinja.Garage.slnx
      
    - name: Build solution
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          dotnet build DotNetNinja.Garage.slnx \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            -p:Version=${{ inputs.version }} \
            -p:AssemblyVersion=${{ inputs.version }} \
            -p:FileVersion=${{ inputs.version }}
        else
          dotnet build DotNetNinja.Garage.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
        fi
      
    - name: Run tests
      run: dotnet test DotNetNinja.Garage.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
      
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ github.run_number }}
        path: ./coverage/**/*.xml