name: Build and Test

on:
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        description: 'Version to use for build'

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

permissions:
  contents: read
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj
      
    - name: Build solution
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          dotnet build tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            -p:Version=${{ inputs.version }} \
            -p:AssemblyVersion=${{ inputs.version }} \
            -p:FileVersion=${{ inputs.version }}
        else
          dotnet build tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
        fi
      
    - name: Run xUnit tests
      run: dotnet run --project tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --no-restore
