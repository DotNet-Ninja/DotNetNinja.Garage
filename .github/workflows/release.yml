name: Manual release package

# Rebuild an existing version for inspection. The main workflow owns tags,
# GitHub releases, and Azure deployment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to package (for example, 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: bash
        env:
          GARAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$GARAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must have major.minor.patch format.' >&2
            exit 1
          fi
      - name: Restore
        run: dotnet restore tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj
      - name: Build
        env:
          GARAGE_VERSION: ${{ inputs.version }}
        run: |
          dotnet build tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj --configuration Release --no-restore \
            -p:Version="$GARAGE_VERSION" \
            -p:AssemblyVersion="$GARAGE_VERSION" \
            -p:FileVersion="$GARAGE_VERSION" \
            -p:InformationalVersion="$GARAGE_VERSION"
      - name: Run xUnit tests
        run: dotnet run --project tests/DotNetNinja.Garage.Tests/DotNetNinja.Garage.Tests.csproj --configuration Release --no-build --no-restore
      - name: Publish package
        env:
          GARAGE_VERSION: ${{ inputs.version }}
        run: |
          dotnet publish src/DotNetNinja.Garage/DotNetNinja.Garage.csproj \
            --configuration Release --no-build --no-restore --output ./publish \
            -p:Version="$GARAGE_VERSION"
          cd publish
          zip -q -r "../DotNetNinja.Garage-$GARAGE_VERSION.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: garage-manual-${{ inputs.version }}
          path: DotNetNinja.Garage-${{ inputs.version }}.zip
          if-no-files-found: error
